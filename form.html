<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Product review form for submitting a review and rating of a product.">

    <meta name="author" content="Oyinlola Ashade">

    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>
                <legend>Product Information</legend>

                <label for="product">
                    Product Name
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>

            </fieldset>


            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">

                    <label for="rating1">
                        ☆
                        <input
                            type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required>
                    </label>

                    <label for="rating2">
                        ☆☆
                        <input
                            type="radio"
                            id="rating2"
                            name="rating"
                            value="2">
                    </label>

                    <label for="rating3">
                        ☆☆☆
                        <input
                            type="radio"
                            id="rating3"
                            name="rating"
                            value="3">
                    </label>

                    <label for="rating4">
                        ☆☆☆☆
                        <input
                            type="radio"
                            id="rating4"
                            name="rating"
                            value="4">
                    </label>

                    <label for="rating5">
                        ☆☆☆☆☆
                        <input
                            type="radio"
                            id="rating5"
                            name="rating"
                            value="5">
                    </label>

                </div>

            </fieldset>


            <fieldset>

                <legend>Installation Information</legend>

                <label for="installDate">
                    Date of Installation
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>

            </fieldset>


            <fieldset>

                <legend>Useful Features</legend>

                <p>Check all that apply:</p>

                <label>
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability">
                    Durability
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use">
                    Ease of Use
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance">
                    Performance
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design">
                    Design
                </label>

            </fieldset>


            <fieldset>

                <legend>Written Review</legend>

                <label for="review">
                    Your Review
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"
                    placeholder="Write your review here..."></textarea>

            </fieldset>


            <fieldset>

                <legend>Your Information</legend>

                <label for="userName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="userName"
                    name="userName"
                    autocomplete="name">

            </fieldset>


            <input
                type="submit"
                value="Submit Review">

        </form>
    </main>


    <footer>
        <p>
            &copy; 2026 | WDD 131 Product Review | Oyinlola Ashade
        </p>
    </footer>

</body>

</html>
